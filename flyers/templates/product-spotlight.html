<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="flyer.css">
<title>Product spotlight — Olympus CX23</title>
<style>
  .product-card { position: relative; z-index: 1; margin-top: 48px; display: grid; grid-template-columns: 400px 1fr; gap: 44px; align-items: center; }
  .product-card figure { background: #fff; border-radius: 36px; aspect-ratio: 1; display: grid; place-items: center; padding: 40px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.5); }
  .product-card img { width: 100%; height: 100%; object-fit: contain; }
  .product-card .checks { margin-top: 0; }
  .product-card .checks li { font-size: 27px; }
  .product-card .checks { gap: 24px; }
  .title { font-size: 88px; }
  .cta-chip { display: inline-block; margin-top: 44px; background: #fff; color: var(--green-800); font-weight: 700; font-size: 30px; padding: 22px 36px; border-radius: 16px; position: relative; z-index: 1; }
</style></head>
<body>
<section class="canvas feed dark rings">
  <header class="f-head"><img class="f-logo" src="../../site/assets/img/logo.png" alt="Flokefama"><span class="pill">Product spotlight</span></header>
  <div style="position:relative;z-index:1;margin-top:96px">
    <!-- EDIT: kicker, title, subtitle -->
    <p class="kicker"><i></i>Laboratory microscopy</p>
    <h1 class="title">Olympus <em>CX23.</em><br>Clarity you can trust.</h1>
  </div>
  <div class="product-card">
    <!-- EDIT: product image (square, white background) -->
    <figure><img src="../../site/assets/img/products/olympus-cx23.webp" alt=""></figure>
    <!-- EDIT: three short benefits, max ~5 words each -->
    <ul class="checks">
      <li>Sharp, bright optics</li>
      <li>Ergonomic for long shifts</li>
      <li>Installed &amp; serviced locally</li>
    </ul>
  </div>
  <span class="cta-chip" style="align-self:flex-start">Request a quote today →</span>
  <footer class="f-foot"><span>+233 53 339 2863</span><span class="muted">flokefama.com</span></footer>
</section>
</body></html>
